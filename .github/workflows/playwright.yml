name: Playwright Tests
on:
  push:
    branches: [ main, master , develop]
  pull_request:
    branches: [ main, master ,develop]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npm run cucumber
    - name: Upload Cucumber Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        # O nome do artefato terá o número da máquina (ex: cucumber-report-1, cucumber-report-2)
        name: cucumber-report-shard-${{ matrix.shardIndex }}
        # Caminho exato onde o seu Cucumber está configurado para salvar o HTML
        path: features/cucumber-report/
        retention-days: 30
